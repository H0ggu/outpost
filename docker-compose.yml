# Outpost — one service, one port. Copy .env.example to .env and set PUBLIC_ORIGIN first.
# Networking is up to you: publish the port directly, or put any reverse proxy in front
# (then set TRUSTED_PROXIES). Data lives in ./data (SQLite, NNUE cache, uploads).
services:
  outpost:
    build: .
    image: outpost:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Pinned for the container whatever .env says: it always runs in production, binds every
    # interface inside its own network namespace (the published port and the healthcheck need
    # that) and keeps its data in the /data volume.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # To reach Outpost only from this host (e.g. a reverse proxy on the same machine), publish it
    # on loopback instead: "127.0.0.1:${PORT:-8080}:${PORT:-8080}".
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
